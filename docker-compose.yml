services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PARTICIPANT_PATH=${PARTICIPANT_PATH:-gensie.baseline.OfficialParticipant}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-dummy}

    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
